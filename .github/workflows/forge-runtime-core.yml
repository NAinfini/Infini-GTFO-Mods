name: Forge Runtime core

on:
  push:
    branches: [main]
    paths:
      - ForgeRuntime/**
      - ForgeRuntime.Tests/**
      - .github/workflows/forge-runtime-core.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-runtime-core-main
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SDK
        run: dotnet --info
      - name: Build dependency-free core
        run: dotnet build ForgeRuntime/ForgeRuntime.Core.csproj --configuration Release --nologo
      - name: Restore runtime contract harness
        run: dotnet restore ForgeRuntime.Tests/ForgeRuntime.Tests.csproj --nologo
      - name: Run runtime contract harness
        run: dotnet run --project ForgeRuntime.Tests/ForgeRuntime.Tests.csproj --configuration Release --no-restore
